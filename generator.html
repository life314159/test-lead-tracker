<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>領先追蹤圖卡 - 轉播網址生成器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0; padding: 40px 20px;
      color: #333;
    }
    .card {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; color: #1a252f; text-align: center; font-size: 24px; }
    p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #2c3e50; }
    input[type="text"], input[type="url"], select {
      width: 100%; padding: 10px 12px;
      border: 1px solid #ccc; border-radius: 6px;
      font-size: 15px; transition: border-color 0.2s;
      background-color: #fff;
    }
    input[type="text"]:focus, input[type="url"]:focus, select:focus {
      border-color: #3498db; outline: none;
    }
    
    .team-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 15px;
      align-items: center;
    }
    .color-picker-wrapper {
      display: flex; align-items: center; gap: 10px;
    }
    input[type="color"] {
      -webkit-appearance: none; border: none;
      width: 40px; height: 40px;
      border-radius: 6px; cursor: pointer;
      background: none;
    }

    button.btn-generate {
      width: 100%; padding: 12px;
      background-color: #27ae60; color: white;
      border: none; border-radius: 6px;
      font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.2s;
    }
    button.btn-generate:hover { background-color: #219150; }

    .result-box {
      margin-top: 25px; padding: 20px;
      background: #f8f9fa; border: 1px solid #e9ecef;
      border-radius: 8px; display: none;
    }
    .result-box label { color: #27ae60; }
    textarea {
      width: 100%; height: 70px;
      padding: 10px; border: 1px solid #ced4da;
      border-radius: 6px; font-family: monospace;
      font-size: 13px; resize: none; margin-bottom: 15px;
    }
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-action {
      flex: 1; padding: 10px;
      border: none; border-radius: 6px;
      font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .btn-copy { background-color: #3498db; color: white; }
    .btn-copy:hover { background-color: #2980b9; }
    .btn-open { background-color: #e67e22; color: white; }
    .btn-open:hover { background-color: #d35400; }

    /* 預設視窗樣式 */
    .preview-title { font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
    .iframe-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px dashed #bbb;
      border-radius: 8px;
      overflow: hidden;
      background-color: #111;
    }
    iframe {
      width: 100%; height: 100%; border: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>領先追蹤圖卡 網址生成器</h2>
  <p class="subtitle">選擇比賽球隊與 API，自動帶出代表色並生成轉播網址</p>

  <form id="urlForm">
    <!-- API 網址 -->
    <div class="form-group">
      <label for="apiUrl">Play-by-play API 網址 (選填，若留空將載入展示用假資料)</label>
      <input type="url" id="apiUrl" placeholder="https://api.yourleague.com/api/opendata/GetPlayByPlayShow">
    </div>

    <!-- 主隊資訊 -->
    <div class="form-group">
      <label for="homeSelect">主隊設定 (Home Team)</label>
      <div class="team-row">
        <select id="homeSelect" required></select>
        <div class="color-picker-wrapper">
          <input type="color" id="homeColor" value="#14259B">
          <span id="homeColorHex">#14259B</span>
        </div>
      </div>
    </div>

    <!-- 客隊資訊 -->
    <div class="form-group">
      <label for="awaySelect">客隊設定 (Away Team)</label>
      <div class="team-row">
        <select id="awaySelect" required></select>
        <div class="color-picker-wrapper">
          <input type="color" id="awayColor" value="#EC6C00">
          <span id="awayColorHex">#EC6C00</span>
        </div>
      </div>
    </div>

    <button type="submit" class="btn-generate">產生轉播網址與更新預覽</button>
  </form>

  <!-- 產出結果與預覽區 -->
  <div class="result-box" id="resultBox">
    <label>生成的轉播網址 (適用於 vMix / CharacterWorks / OBS)</label>
    <textarea id="outputUrl" readonly></textarea>
    <div class="btn-group">
      <button class="btn-action btn-copy" id="btnCopy">複製網址</button>
      <button class="btn-action btn-open" id="btnOpen">新分頁全螢幕開啟</button>
    </div>

    <!-- 畫面預覽區塊 -->
    <div class="preview-title">📺 實際畫面即時預覽 (Live Preview)</div>
    <div class="iframe-wrapper">
      <iframe id="previewIframe" src=""></iframe>
    </div>
  </div>
</div>

<script>
  // 1. 隊名與代表色對照表
  const TEAM_PRESETS = {
    "政治大學": "#14259B",   // 深藍
    "國立體大": "#EC6C00",   // 橘色
    "健行科大": "#039FFF",   // 寶藍
    "臺灣藝大": "#0C1431",   // 深藍
    "輔仁大學-男": "#941E2E", // 紅色
    "臺灣師大-男": "#8A2429", // 紅色
    "義守大學": "#38235E",   // 紫色
    "虎尾科大": "#0767CC",   // 亮藍
    "中原大學": "#0056BD",   // 藍色
    "黎明學院": "#CD523D",   // 橘色
    "高雄師大": "#1A1B35",   // 靛藍
    "台鋼科大": "#292920",   // 深灰
    "北市大學-男": "#FFFF4C",  // 黃色
    "文化大學-男": "#292920",  // 深灰
    "臺灣科大-男": "#0D0B09",  // 黑色
    "中信學院-男": "#007C7D"   // 湖水綠
  };

  const homeSelect = document.getElementById('homeSelect');
  const awaySelect = document.getElementById('awaySelect');
  const homeColorInput = document.getElementById('homeColor');
  const awayColorInput = document.getElementById('awayColor');
  const homeColorHex = document.getElementById('homeColorHex');
  const awayColorHex = document.getElementById('awayColorHex');
  const previewIframe = document.getElementById('previewIframe');

  // 2. 初始化選單
  function initTeamSelects() {
    let optionsHtml = '<option value="">-- 請選擇球隊 --</option>';
    for (const team in TEAM_PRESETS) {
      optionsHtml += `<option value="${team}">${team}</option>`;
    }
    
    homeSelect.innerHTML = optionsHtml;
    awaySelect.innerHTML = optionsHtml;

    homeSelect.value = "政治大學";
    awaySelect.value = "國立體大";
    updateHomeColor();
    updateAwayColor();
  }

  function updateHomeColor() {
    const selectedTeam = homeSelect.value;
    if (TEAM_PRESETS[selectedTeam]) {
      homeColorInput.value = TEAM_PRESETS[selectedTeam];
      homeColorHex.innerText = TEAM_PRESETS[selectedTeam].toUpperCase();
    }
  }

  function updateAwayColor() {
    const selectedTeam = awaySelect.value;
    if (TEAM_PRESETS[selectedTeam]) {
      awayColorInput.value = TEAM_PRESETS[selectedTeam];
      awayColorHex.innerText = TEAM_PRESETS[selectedTeam].toUpperCase();
    }
  }

  homeSelect.addEventListener('change', updateHomeColor);
  awaySelect.addEventListener('change', updateAwayColor);

  homeColorInput.addEventListener('input', e => {
    homeColorHex.innerText = e.target.value.toUpperCase();
  });
  awayColorInput.addEventListener('input', e => {
    awayColorHex.innerText = e.target.value.toUpperCase();
  });

  initTeamSelects();

  // 3. 生成網址與更新預覽 Iframe
  document.getElementById('urlForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const baseUrl = window.location.origin + window.location.pathname.replace('generator.html', '');

    const rawApi = document.getElementById('apiUrl').value.trim();
    const apiParam = rawApi ? `&api=${encodeURIComponent(rawApi)}` : '';
    const homeName = encodeURIComponent(homeSelect.value.trim());
    const awayName = encodeURIComponent(awaySelect.value.trim());
    
    const homeColor = homeColorInput.value.replace('#', '%23');
    const awayColor = awayColorInput.value.replace('#', '%23');

    // 組合網址
    const finalUrl = `${baseUrl}?homeName=${homeName}&awayName=${awayName}&homeColor=${homeColor}&awayColor=${awayColor}${apiParam}`;

    // 顯示文字網址
    document.getElementById('outputUrl').value = finalUrl;
    document.getElementById('resultBox').style.display = 'block';

    // 即時載入到預覽框架中
    previewIframe.src = finalUrl;
  });

  // 4. 按鈕處理
  document.getElementById('btnCopy').addEventListener('click', function() {
    const outputText = document.getElementById('outputUrl');
    outputText.select();
    document.execCommand('copy');
    alert('已成功複製網址到剪貼簿！');
  });

  document.getElementById('btnOpen').addEventListener('click', function() {
    const finalUrl = document.getElementById('outputUrl').value;
    if (finalUrl) {
      window.open(finalUrl, '_blank');
    }
  });
</script>

</body>
</html>
